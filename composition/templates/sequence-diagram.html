<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280, initial-scale=1"><title>Generic Mermaid Sequence Animation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071524;color:#edf7ff;font-family:system-ui,sans-serif}#root{width:1280px;height:720px;position:relative;overflow:hidden;padding:42px 55px;background:radial-gradient(ellipse at 90% 0%,#163c55,transparent 52%),#071524}
.kicker{color:#80def6;letter-spacing:2px;font-size:14px;font-weight:800}h1{font-size:35px;margin:12px 0 4px}.sub{color:#a7c4d8;font-size:17px}
.board{position:absolute;left:55px;right:55px;top:190px;height:400px;border:1px solid #33546f;background:#0d2135;border-radius:16px;overflow:hidden}svg{width:100%;height:100%}#detail{position:absolute;left:55px;top:609px;font-size:20px;color:#d5ecff;right:55px}.progress{position:absolute;left:55px;right:55px;bottom:29px;height:5px;background:#294b62;border-radius:20px;overflow:hidden}#fill{height:100%;width:0;background:#6ad9f6}
</style><script src="./assets/gsap.min.js"></script></head><body>
<div id="root" data-composition-id="sequence-diagram" data-start="0" data-duration="16" data-width="1280" data-height="720">
<div class="kicker">AI ENGINEERING LAB / MERMAID SEQUENCE DIAGRAM</div><h1>Animated Sequence Diagram</h1><div class="sub" id="sub"></div>
<div class="board"><svg id="diagram" viewBox="0 0 1170 400"></svg></div><div id="detail"></div><div class="progress"><div id="fill"></div></div>
<script>
(function(){
  const sceneTiming=window.__sceneTiming || null;
  const videoDuration=Number(document.getElementById('root').dataset.duration);
  const data={{RENDER_DATA}},svg=document.getElementById('diagram'),ns='http://www.w3.org/2000/svg';
  const put=(tag,attrs,txt)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;svg.append(e);return e;};
  const n=data.participants.length;const xs=data.participants.map((_,i)=>95+i*(980/Math.max(1,n-1)));
  document.getElementById('sub').textContent=n+' participants · '+data.messages.length+' messages · '+videoDuration.toFixed(1)+'-second timeline';
  data.participants.forEach((p,i)=>{const x=xs[i];put('rect',{x:x-76,y:18,width:152,height:54,rx:10,fill:'#173e54',stroke:'#4e86a0'});put('text',{x,y:41,'text-anchor':'middle',fill:'#fff','font-size':15,'font-weight':700},p.label.slice(0,21));put('text',{x,y:58,'text-anchor':'middle',fill:'#99cadb','font-size':11},p.role.slice(0,24));put('line',{x1:x,y1:73,x2:x,y2:375,stroke:'#42667d','stroke-dasharray':'5 5'});});
  const tl=gsap.timeline({paused:true}),duration=(videoDuration-2)/Math.max(1,data.messages.length);
  data.messages.forEach((m,i)=>{
    const from=data.participants.findIndex(p=>p.id===m.from),to=data.participants.findIndex(p=>p.id===m.to);
    const y=105+i*(245/Math.max(1,data.messages.length-1));let x1=xs[from],x2=xs[to];if(from===to)x2=x1+55;
    const line=put('line',{x1,y1:y,x2,y2:y,stroke:m.arrow.startsWith('--')?'#8fdcbf':'#78d8fa','stroke-width':3,'stroke-dasharray':m.arrow.startsWith('--')?'7 5':'none',opacity:.08});
    const triangle=put('path',{d:`M${x2+(x2>=x1?-8:8)} ${y-5} L${x2} ${y} L${x2+(x2>=x1?-8:8)} ${y+5}`,stroke:'#78d8fa','stroke-width':2,fill:'none',opacity:.08});
    const mid=(x1+x2)/2;
    const label=put('text',{x:mid,y:y-9,'text-anchor':'middle','font-size':12,fill:'#d8efff',opacity:.05},m.label.slice(0,80));
    const t=sceneTiming ? sceneTiming.scenes[i].start : i*duration;
    tl.to([line,triangle,label],{opacity:1,duration:.35},t+.15);
    tl.set('#detail',{textContent:String(i+1).padStart(2,'0')+' / '+data.messages.length+' · '+m.label},t);
  });
  tl.to('#fill',{width:'100%',duration:videoDuration,ease:'none'},0);
  tl.to({}, {duration:.01},videoDuration-.01);
  window.__timelines=window.__timelines||{};window.__timelines['sequence-diagram']=tl;
})();
</script></div></body></html>
